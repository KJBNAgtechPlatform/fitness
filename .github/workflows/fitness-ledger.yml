name: Fitness Ledger

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-board:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      workout-count: ${{ steps.process-workouts.outputs.workout-count }}
      updated-users: ${{ steps.process-workouts.outputs.updated-users }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for streak calculation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml emoji
          pip install python-dateutil  # For flexible date parsing

      - name: Parse workout files & rebuild leaderboard
        id: process-workouts
        shell: python
        run: |
          import os
          import glob
          import yaml
          import datetime
          import emoji
          import json
          import pathlib
          from collections import defaultdict
          from dateutil import parser as date_parser

          # --- Configuration ---
          workout_glob = "**/20*.md"
          leaderboard_path = "README.md"
          slack_webhook = os.getenv("SLACK_WEBHOOK")  # optional
          # ---------------------

          def parse_one(path):
              """Parse a single workout markdown file."""
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                  if "---" not in content:
                      # No front-matter, extract date from filename
                      filename = pathlib.Path(path).stem
                      date_part = filename.split('-')[:3]
                      return {
                          "file": path,
                          "date": '-'.join(date_part) if len(date_part) == 3 else None
                      }
                  
                  # Split by front-matter markers
                  parts = content.split('---', 2)
                  if len(parts) < 3:
                      return {"file": path}
                  
                  front_matter = parts[1]
                  data = yaml.safe_load(front_matter) or {}
                  data["file"] = path
                  
                  # Extract date from filename if not in front-matter
                  if "date" not in data:
                      filename = pathlib.Path(path).stem
                      date_part = filename.split('-')[:3]
                      if len(date_part) == 3:
                          data["date"] = '-'.join(date_part)
                  
                  return data
              except Exception as e:
                  print(f"Error parsing {path}: {e}")
                  return {"file": path}

          # Find and parse all workout files
          workout_files = glob.glob(workout_glob, recursive=True)
          workouts = [parse_one(f) for f in workout_files]
          
          # Debug output
          print(f"Found {len(workouts)} workout files")
          
          # Accumulate stats and track dates for streak calculation
          stats = {}
          workout_dates = defaultdict(list)  # person -> list of dates
          
          for w in workouts:
              # Determine author
              who = w.get("author")
              if not who:
                  try:
                      who = pathlib.Path(w["file"]).parts[0]
                  except (IndexError, AttributeError):
                      who = "unknown"
              
              # Parse duration
              try:
                  dur = int(w.get("duration", 0))
              except (ValueError, TypeError):
                  dur = 0
              
              # Parse date for streak calculation
              date_str = w.get("date")
              if date_str:
                  try:
                      # Try to parse various date formats
                      date_obj = date_parser.parse(date_str, fuzzy=True).date()
                      workout_dates[who].append(date_obj)
                  except:
                      pass
              
              # Initialize stats for new user
              if who not in stats:
                  stats[who] = {
                      "minutes": 0,
                      "streak": 0,
                      "activities": set(),
                      "workout_count": 0
                  }
              
              # Update stats
              stats[who]["minutes"] += dur
              stats[who]["activities"].add(w.get("activity", "workout").title())
              stats[who]["workout_count"] += 1

          # Calculate streaks
          for who, dates in workout_dates.items():
              if who not in stats:
                  continue
              
              # Sort dates and find current streak
              dates = sorted(set(dates))  # Remove duplicates and sort
              if not dates:
                  continue
                  
              # Find current streak (most recent consecutive days)
              current_streak = 1
              today = datetime.date.today()
              yesterday = today - datetime.timedelta(days=1)
              
              # Check if latest workout was today or yesterday
              latest_date = dates[-1]
              if latest_date < yesterday:
                  current_streak = 0
              else:
                  # Count backwards from latest date
                  for i in range(len(dates) - 2, -1, -1):
                      if (dates[i+1] - dates[i]).days == 1:
                          current_streak += 1
                      else:
                          break
              
              stats[who]["streak"] = current_streak

          # Build markdown table
          header = "| Author | Total Minutes | Activities | Workouts | Streak 🔥 |\n|--------|---------------|------------|----------|-----------|"
          rows = []
          
          for who, s in sorted(stats.items(), key=lambda kv: kv[1]["minutes"], reverse=True):
              acts = ", ".join(sorted(s["activities"])) if s["activities"] else "Various"
              streak_display = f"{s['streak']} day{'s' if s['streak'] != 1 else ''}" if s['streak'] > 0 else "–"
              rows.append(f"| {who} | {s['minutes']} | {acts} | {s['workout_count']} | {streak_display} |")
          
          table = "\n".join([header] + rows)

          # Emoji badges
          badges = []
          for who, s in stats.items():
              if s["minutes"] >= 500:
                  badges.append(f"{who} {emoji.emojize(':rocket:')} 500-min club")
              if s["minutes"] >= 1000:
                  badges.append(f"{who} {emoji.emojize(':trophy:')} 1000-min elite")
              if s["streak"] >= 5:
                  badges.append(f"{who} {emoji.emojize(':fire:')} 5-day streak")
              if s["streak"] >= 10:
                  badges.append(f"{who} {emoji.emojize(':star-struck:')} 10-day champion")
              if s["workout_count"] >= 20:
                  badges.append(f"{who} {emoji.emojize(':muscle:')} 20+ workouts")

          badge_section = ""
          if badges:
              badge_section = "### 🏆 Badges\n" + "\n".join(f"- {b}" for b in badges) + "\n\n"

          # Generate summary for Slack
          top_performer = max(stats.items(), key=lambda kv: kv[1]["minutes"]) if stats else None
          total_minutes = sum(s["minutes"] for s in stats.values())
          total_workouts = sum(s["workout_count"] for s in stats.values())
          
          # Set outputs for other steps
          print(f"::set-output name=workout-count::{len(workouts)}")
          print(f"::set-output name=updated-users::{len(stats)}")
          print(f"::set-output name=total-minutes::{total_minutes}")
          
          if top_performer:
              print(f"::set-output name=top-performer::{top_performer[0]}")
              print(f"::set-output name=top-minutes::{top_performer[1]['minutes']}")

          # Write README
          readme = f"""# 🏃‍♂️ Code & Commit Fitness Ledger

**Last updated**: {datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")}

**Total workouts**: {total_workouts}  
**Total minutes**: {total_minutes}  
**Active participants**: {len(stats)}

## Leaderboard

{table}

{badge_section}---
### How to Participate

1. Create a new markdown file in the appropriate folder: `YYYY-MM-DD-yourhandle.md`
2. Add front-matter with your workout details:
```yaml
---
author: yourhandle
duration: 30  # minutes
activity: running  # running, cycling, yoga, gym, etc.
date: YYYY-MM-DD  # optional, defaults to filename
---
