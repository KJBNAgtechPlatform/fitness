      with open(leaderboard_path, "w", encoding="utf-8") as f:
          f.write(readme)
      
      print(f"Successfully updated {leaderboard_path}")

  - name: Commit & push updated README
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "github-actions[bot]@users.noreply.github.com"
      git add README.md
      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore: update fitness leaderboard [skip ci]"
        git push
        echo "✅ Leaderboard updated"
      fi

  - name: Rich Slack notification
    if: env.SLACK_WEBHOOK != ''
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      WORKOUT_COUNT: ${{ steps.process-workouts.outputs.workout-count }}
      UPDATED_USERS: ${{ steps.process-workouts.outputs.updated-users }}
      TOTAL_MINUTES: ${{ steps.process-workouts.outputs.total-minutes }}
      TOP_PERFORMER: ${{ steps.process-workouts.outputs.top-performer }}
      TOP_MINUTES: ${{ steps.process-workouts.outputs.top-minutes }}
    run: |
      # Create rich Slack message
      MESSAGE=$(cat << EOF
      {
        "blocks": [
          {
            "type": "header",
            "text": {
              "type": "plain_text",
              "text": "🏆 Fitness Leaderboard Updated",
              "emoji": true
            }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Total Workouts*\n${{ env.WORKOUT_COUNT }}"
              },
              {
                "type": "mrkdwn",
                "text": "*Active Participants*\n${{ env.UPDATED_USERS }}"
              },
              {
                "type": "mrkdwn",
                "text": "*Total Minutes*\n${{ env.TOTAL_MINUTES }}"
              }
            ]
          }
      EOF
      )
      
      # Add top performer if available
      if [ -n "$TOP_PERFORMER" ] && [ -n "$TOP_MINUTES" ]; then
        MESSAGE="$MESSAGE,
          {
            \"type\": \"section\",
            \"text\": {
              \"type\": \"mrkdwn\",
              \"text\": \"*Top Performer* :trophy:\\n$TOP_PERFORMER with $TOP_MINUTES minutes\"
            }
          }"
      fi
      
      # Add action button
      MESSAGE="$MESSAGE,
          {
            \"type\": \"actions\",
            \"elements\": [
              {
                \"type\": \"button\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"View Leaderboard\",
                  \"emoji\": true
                },
                \"url\": \"https://github.com/${{ github.repository }}\"
              }
            ]
          }
        ]
      }"
      
      echo "Sending Slack notification..."
      curl -X POST -H 'Content-type: application/json' \
        --data "$MESSAGE" \
        --fail-with-body \
        --silent \
        "$SLACK_WEBHOOK" || echo "⚠️ Slack notification failed (non-critical)"

  - name: Summary
    run: |
      echo "✅ Workflow completed successfully!"
      echo "📊 Workouts processed: ${{ steps.process-workouts.outputs.workout-count }}"
      echo "👥 Users updated: ${{ steps.process-workouts.outputs.updated-users }}"
      echo "⏱️ Total minutes: ${{ steps.process-workouts.outputs.total-minutes || 0 }}"
